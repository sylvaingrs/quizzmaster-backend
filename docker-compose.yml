services:
  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: valkey
    ports:
      - "${VALKEY_PORT}:${VALKEY_PORT}"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ${API_GATEWAY_SERVICE_NAME}
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL}
      QUIZZ_SERVICE_URL: ${QUIZZ_SERVICE_URL}
      SCORE_SERVICE_URL: ${SCORE_SERVICE_URL}
    depends_on:
      user-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      quizz-service:
        condition: service_healthy
      score-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${API_GATEWAY_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ${USER_SERVICE_NAME}
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    env_file:
      - .env
      - ./packages/prisma/.env
    environment:
      NODE_ENV: production
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${USER_SERVICE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  room-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ${ROOM_SERVICE_NAME}
    container_name: room-service
    ports:
      - "${ROOM_SERVICE_PORT}:${ROOM_SERVICE_PORT}"
    environment:
      NODE_ENV: production
      QUIZZ_SERVICE_URL: ${QUIZZ_SERVICE_URL}
      SCORE_SERVICE_URL: ${SCORE_SERVICE_URL}
      VALKEY_HOST: ${VALKEY_HOST}
      VALKEY_PORT: ${VALKEY_PORT}
    env_file:
      - .env
      - ./packages/prisma/.env
    depends_on:
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${ROOM_SERVICE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  quizz-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ${QUIZZ_SERVICE_NAME}
    container_name: quizz-service
    ports:
      - "${QUIZZ_SERVICE_PORT}:${QUIZZ_SERVICE_PORT}"
    env_file:
      - .env
      - ./packages/prisma/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${QUIZZ_SERVICE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  score-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ${SCORE_SERVICE_NAME}
    container_name: score-service
    ports:
      - "${SCORE_SERVICE_PORT}:${SCORE_SERVICE_PORT}"
    env_file:
      - .env
      - ./packages/prisma/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${SCORE_SERVICE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data: