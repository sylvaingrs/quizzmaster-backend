version: '3.8'

services:
  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: valkey
    ports:
      - '6379:6379'

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: quizDB
      POSTGRES_USER: quizUser
      POSTGRES_PASSWORD: quizPassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
    driver: local
