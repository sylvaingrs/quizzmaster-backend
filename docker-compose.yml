services:
  postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/postgres/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: valkey
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ROOM_SERVICE_URL: http://room-service:3002
      QUIZ_SERVICE_URL: http://quizz-service:3003
      SCORE_SERVICE_URL: http://score-service:3004
    depends_on:
      - room-service
      - quizz-service
      - score-service

  room-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    container_name: room-service
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      QUIZ_SERVICE_URL: http://quizz-service:3003
      SCORE_SERVICE_URL: http://score-service:3004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    depends_on:
      - valkey
      - rabbitmq
      - quizz-service
      - score-service
      - postgres

  quizz-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: quizz-service
    container_name: quizz-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    depends_on:
      - postgres

  score-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: score-service
    container_name: score-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data: